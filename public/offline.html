<!doctype html>
<!--
  The page the service worker shows when a page is opened with no signal and there is no saved copy of it
  (public/sw.js, C203). One file with nothing to load: the styles and the script are inline, the colours are
  copied from app/globals.css, and the fonts fall back to the phone's own. It lists the trips saved on this
  device (localStorage "turuj-saved-trips", lib/savedTrips.ts) and links the ones whose page is kept.
  Slovak by default; English under /en. Keep it small: it is fetched when the service worker installs.
-->
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1724" media="(prefers-color-scheme: dark)">
<title>Ste bez signálu | Túruj</title>
<style>
  :root {
    --background: #f5f9fc; --foreground: #14233b; --muted: #556274; --card-bg: #ffffff;
    --border: #dde7f1; --accent: #1769d1; --accent-contrast: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0f1724; --foreground: #e8eef6; --muted: #a8b6c8; --card-bg: #172233;
      --border: #283750; --accent: #6fb0ff; --accent-contrast: #0b1830;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--background); color: var(--foreground);
    font: 16px/1.45 Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    display: flex; flex-direction: column; gap: 16px; max-width: 640px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
  h1 { margin: 12px 0 0; font-size: 2.15rem; line-height: 1; font-weight: 800; letter-spacing: -0.025em; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .trip {
    display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 16px; background: var(--card-bg);
    color: inherit; text-decoration: none;
  }
  a.trip:hover { border-color: var(--accent); }
  .trip b { display: block; font-weight: 700; }
  .trip small { display: block; font-size: 12.5px; color: var(--muted); }
  .trip span { min-width: 0; flex: 1; }
  .trip svg { flex: none; color: var(--muted); }
  .off { opacity: 0.6; }
  button, .quiet {
    display: block; width: 100%; padding: 12px 16px; border-radius: 12px; font: inherit; text-align: center; cursor: pointer;
  }
  button { border: 0; background: var(--accent); color: var(--accent-contrast); font-weight: 700; }
  .quiet {
    border: 1px solid var(--border); background: var(--card-bg); color: inherit; font-size: 14px; font-weight: 600;
    text-decoration: none; padding: 10px 16px;
  }
  .quiet:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">Túruj</div>
  <h1 id="title">Ste bez signálu</h1>
  <p id="lead" class="muted">Na hľadanie výletov treba signál. Výlet, ktorý si uložíte, sa nabudúce otvorí aj bez neho.</p>
  <ul id="trips" hidden></ul>
  <button type="button" id="retry">Skúsiť znova</button>
  <a id="mine" class="quiet" href="/ulozene" hidden>Moje výlety</a>
</main>
<script>
(function () {
  var en = /^\/en(\/|$)/.test(location.pathname);
  var T = en
    ? { title: "No signal", none: "Finding trips needs a signal. A trip you save opens without one next time.", some: "Your saved trips open without it:", retry: "Try again", mine: "My trips", nocopy: "no offline copy", doc: "No signal | Túruj" }
    : { title: "Ste bez signálu", none: "Na hľadanie výletov treba signál. Výlet, ktorý si uložíte, sa nabudúce otvorí aj bez neho.", some: "Uložené výlety otvoríte aj bez neho:", retry: "Skúsiť znova", mine: "Moje výlety", nocopy: "bez kópie na cestu", doc: "Ste bez signálu | Túruj" };
  var $ = function (id) { return document.getElementById(id); };
  if (en) document.documentElement.lang = "en";
  document.title = T.doc;
  $("title").textContent = T.title;
  $("lead").textContent = T.none;
  $("retry").textContent = T.retry;
  $("mine").textContent = T.mine;

  // Back online: the page that was asked for.
  $("retry").addEventListener("click", function () { location.reload(); });
  // Some browsers fire "online" while still offline, or as a link is being followed: reload only when it is true and nothing else is loading.
  var leaving = false;
  window.addEventListener("pagehide", function () { leaving = true; });
  document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("a")) leaving = true; });
  window.addEventListener("online", function () { if (navigator.onLine && !leaving) location.reload(); });

  var saved = [];
  try {
    var parsed = JSON.parse(localStorage.getItem("turuj-saved-trips") || "[]");
    if (Array.isArray(parsed)) saved = parsed.filter(function (t) { return t && typeof t.slug === "string" && typeof t.name === "string"; });
  } catch (e) {}

  /** "sobota 28. 11. o 8:40" */
  function when(t) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t.date || "");
    if (!m) return "";
    var day = "";
    try {
      day = new Intl.DateTimeFormat(en ? "en-GB" : "sk-SK", en ? { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" } : { weekday: "long", day: "numeric", month: "numeric", timeZone: "UTC" })
        .format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])));
    } catch (e) {
      day = +m[3] + ". " + +m[2] + ".";
    }
    var time = /^\d{2}:\d{2}$/.test(t.time || "") ? t.time.replace(/^0/, "") : "";
    return time ? day + (en ? " at " : " o ") + time : day;
  }

  /** The saved copy of the trip's page, in whichever language it was saved from; null without one. */
  function copyOf(slug) {
    if (!("caches" in window)) return Promise.resolve(null);
    var paths = en ? ["/en/trasa/" + slug, "/trasa/" + slug] : ["/trasa/" + slug, "/en/trasa/" + slug];
    return paths.reduce(function (found, path) {
      return found.then(function (hit) {
        if (hit) return hit;
        return caches.match(path, { ignoreSearch: true }).then(function (res) { return res ? path : null; });
      });
    }, Promise.resolve(null)).catch(function () { return null; });
  }

  if ("caches" in window) {
    caches.match("/ulozene").then(function (res) { if (res) $("mine").hidden = false; }).catch(function () {});
  }
  if (!saved.length) return;

  Promise.all(saved.map(function (t) { return copyOf(t.slug); })).then(function (paths) {
    var list = $("trips");
    saved.forEach(function (t, i) {
      var row = document.createElement(paths[i] ? "a" : "div");
      row.className = paths[i] ? "trip" : "trip off";
      if (paths[i]) row.href = paths[i];
      var text = document.createElement("span");
      var name = document.createElement("b");
      name.textContent = t.name;
      var meta = document.createElement("small");
      meta.textContent = [when(t), paths[i] ? "" : T.nocopy].filter(Boolean).join(" · ");
      text.appendChild(name);
      text.appendChild(meta);
      row.appendChild(text);
      if (paths[i]) row.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      var li = document.createElement("li");
      li.appendChild(row);
      list.appendChild(li);
    });
    if (paths.some(Boolean)) $("lead").textContent = T.some;
    list.hidden = false;
  });
})();
</script>
</body>
</html>
