name: KV usage check

# Read-only: which pages the Worker wrote to the page cache (PAGE_CACHE, lib/pageCache.ts),
# so the free 1,000 KV writes/day can be planned for. Lists keys only; writes nothing.

on:
  push:
    branches: ["claude/project-thread-tenkmx"]
    paths: [".github/workflows/kv-usage.yml"]
  workflow_dispatch:

jobs:
  usage:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Page cache keys by kind of page
        run: |
          npx -y wrangler@4 kv namespace list > ns.json 2> err.txt || true
          if ! grep -q '\[' ns.json; then echo "Could not list KV namespaces:"; cat ns.json err.txt | grep -v -i token | tail -20; exit 0; fi
          node -e 'const a=JSON.parse(require("fs").readFileSync("ns.json","utf8").replace(/^[^\[]*/,""));for(const n of a)console.log(n.id,n.title)'
          for id in $(node -e 'const a=JSON.parse(require("fs").readFileSync("ns.json","utf8").replace(/^[^\[]*/,""));for(const n of a)if(/PAGE_CACHE|page/i.test(n.title))console.log(n.id)'); do
            echo "### namespace $id"
            npx -y wrangler@4 kv key list --namespace-id "$id" --remote > keys.json 2>/dev/null || npx -y wrangler@4 kv key list --namespace-id "$id" > keys.json
            node -e '
              const a = JSON.parse(require("fs").readFileSync("keys.json","utf8").replace(/^[^\[]*/,""));
              console.log("keys:", a.length);
              const kinds = {}, builds = {}, exp = {};
              for (const k of a) {
                const n = k.name;
                const parts = n.split("/");
                builds[parts[1]] = (builds[parts[1]] || 0) + 1;
                const path = n.replace(/^pages\/[^/]+\//, "");
                const kind = path.replace(/trasa\/[^/]+/, "trasa/*").replace(/vylety-z\/[^/]+/, "vylety-z/*").replace(/\.cache$/, "");
                kinds[kind] = (kinds[kind] || 0) + 1;
                if (k.expiration) { const d = new Date((k.expiration - 3*24*3600) * 1000).toISOString().slice(0, 13); exp[d] = (exp[d] || 0) + 1; }
              }
              console.log("by build:", JSON.stringify(builds));
              console.log("by kind:"); for (const [k, v] of Object.entries(kinds).sort((x, y) => y[1] - x[1]).slice(0, 30)) console.log(String(v).padStart(6), k);
              console.log("written per hour (UTC):"); for (const [k, v] of Object.entries(exp).sort()) console.log(k, v);
              console.log("sample:", a.slice(0, 15).map(k => k.name).join("\n"));
            '
          done
