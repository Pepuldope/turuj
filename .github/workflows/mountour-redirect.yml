name: Deploy mountour redirect

# Deploys workers/mountour-redirect (the old mountour workers.dev address redirects to turuj.sk, F23)
# with the same Cloudflare secrets as deploy.yml. By hand only: "Run workflow".

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.CF_READY != 'true'
        run: echo "::notice::CLOUDFLARE_DEPLOY_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not set; nothing deployed."
      - if: env.CF_READY == 'true'
        uses: actions/checkout@v7
      - if: env.CF_READY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: env.CF_READY == 'true'
        run: npm ci
      - if: env.CF_READY == 'true'
        run: npx wrangler deploy --config workers/mountour-redirect/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
