name: Site up check

# Every 30 minutes: is turuj.sk answering? It asks for the home page, one trip page and the
# sign-in check. Each is tried three times (twice again, 30 s apart) before the job fails, so one
# slow answer is not an alarm. A failed scheduled run e-mails the repo owner; that e-mail is the
# alert. Reads only, writes nothing, never touches the data workflows or the deploy.
# (GitHub may start a scheduled run a few minutes late, and switches schedules off after 60 days
# without repo activity; a push to main turns them back on.)

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://turuj.sk
    steps:
      - name: Home, a trip page, sign-in check
        shell: bash
        run: |
          # check <name> <path> <text the answer must contain>
          check() {
            local name="$1" path="$2" needle="$3" body code
            for attempt in 1 2 3; do
              body="$(mktemp)"
              code="$(curl -sS -m 25 -o "$body" -w '%{http_code}' -H 'Cache-Control: no-cache' "$SITE$path" 2>&1)" || code="curl-failed"
              if [ "$code" = "200" ] && grep -q -- "$needle" "$body"; then
                echo "ok: $name ($path)"
                return 0
              fi
              echo "attempt $attempt: $name ($path) gave $code"
              [ "$attempt" -lt 3 ] && sleep 30
            done
            echo "::error title=turuj.sk is not answering::$name ($path) failed three times, last answer: $code"
            return 1
          }
          failed=0
          check "home page" "/" "Túruj" || failed=1
          check "trip page" "/trasa/krivan" "Túruj" || failed=1
          check "sign-in check" "/api/auth/me" '"account"' || failed=1
          exit "$failed"
