name: Map picture

# The picture of the home map that phones show until the live map has drawn
# (scripts/map-picture.mjs -> public/map-picture.jpg). Taken from the live site
# after the weekly trail map deploy, and by hand. The commit is made with the
# workflow's own token, so it starts no deploy: the picture goes live with the
# next deploy of main (keeps within the 5 deploys a day).
on:
  schedule:
    - cron: "40 14 * * 1"
  # A changed picture script takes a new picture on its branch.
  push:
    branches: ["claude/**"]
    paths: ["scripts/map-picture.mjs", ".github/workflows/map-picture.yml"]
  workflow_dispatch:
    inputs:
      url:
        description: "Page to take the picture from"
        required: false
        default: "https://turuj.sk/"

permissions:
  contents: write

concurrency:
  group: map-picture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  picture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Take the picture
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/map-picture.mjs "${{ inputs.url || 'https://turuj.sk/' }}" public/map-picture.jpg
          ls -l public/map-picture.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: map-picture
          path: public/map-picture.jpg
      - name: Commit it
        run: |
          git config user.name "turuj-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/map-picture.jpg
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Home map picture for phones"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
