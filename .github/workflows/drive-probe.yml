name: Drive probe

# Read-only: asks the LIVE /api/drive for one car route and prints it (C37 U-turn,
# Zvolen -> Človekovo parking). Deploys nothing. Remove before merge.

on:
  push:
    branches: ["claude/project-thread-tenkmx"]
    paths: [".github/workflows/drive-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          for from in 48.5776,19.1262 48.5743,19.1529; do
            echo "## from $from"
            curl -sS -A "$UA" -H "Referer: https://turuj.sk/trasa/clovekovo" "https://turuj.sk/api/drive?from=$from&to=48.558996,19.158789" -o r.json -w "%{http_code}\n"
            python3 -c "
          import json;r=json.load(open('r.json'));print({k:v for k,v in r.items() if k not in ('points','tail','walk')})
          for k in ('points',):
            pts=r.get(k) or []
            print(k,len(pts)); print(json.dumps(pts[-60:]))
          t=r.get('tail') or r.get('walk')
          print('tail', json.dumps(t)[:3000] if t else None)
          "
          done
