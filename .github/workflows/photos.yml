name: Place photos

# Free photos for the places trips lead to (pipeline/photos.py), from Wikimedia
# Commons, then Mapillary (downloaded into public/photos/m/). Runs when the weekly trip data is done (so new places get photos the
# same day, however late GitHub starts that run) and commits public/data/photos.json.
# pipeline/photos.py keeps the old file when far fewer photos come back (a bad
# hour at Commons), and the site's tests run before the commit.
on:
  # Only the weekly build on main. Without the branch filter, every PR check of "Weekly trip data"
  # started this job too, and GitHub runs workflow_run jobs on main: each one committed photos.json
  # to main and deployed (15 Nov: 7 deploys, and the photos.json clash that stopped PR #231's merge).
  workflow_run:
    workflows: ["Weekly trip data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "mapillary = only redo the Mapillary step (quick)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write # start deploy.yml after a commit to main

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: pip install Pillow
      - run: python -m pipeline.photos
        env:
          # Mapillary only on a manual "only: mapillary" run until its results have been looked over:
          # on 2026-10-25 its search answered empty everywhere, even for central Bratislava.
          MAPILLARY_TOKEN: ${{ github.event.inputs.only == 'mapillary' && secrets.MAPILLARY_TOKEN || '' }}
          PHOTOS_ONLY: ${{ github.event.inputs.only }}
      # The site reads photos.json on the server: check it (size budget, shape) before it ships.
      - run: npm ci --ignore-scripts
      - run: npx vitest run lib/assetBudget.test.ts
      - name: Commit the photo list
        id: commit
        run: |
          git config user.name "turuj-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp public/data/photos.json "$RUNNER_TEMP/photos.json"
          mkdir -p public/photos/m && cp -r public/photos/m "$RUNNER_TEMP/mly"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -f --detach "origin/${GITHUB_REF_NAME}"
            # A run that started before the photo code or the photo files changed on the branch
            # would put its older result over them (31 Oct: a run started before #189 wiped the
            # 132 photos #189 had brought back). Leave those to next week's run instead.
            if ! git diff --quiet "$GITHUB_SHA" HEAD -- pipeline/photos.py data/photo-overrides.json public/data/photos.json public/photos/m; then
              echo "Photo code or files changed on ${GITHUB_REF_NAME} during this run: not committing."; exit 0
            fi
            cp "$RUNNER_TEMP/photos.json" public/data/photos.json
            rm -rf public/photos/m && mkdir -p public/photos && cp -r "$RUNNER_TEMP/mly" public/photos/m
            git add public/data/photos.json public/photos/m
            if git diff --cached --quiet; then echo "No changes."; exit 0; fi
            git commit -m "Place photos from Wikimedia Commons"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "committed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      # Deploy only when new photos actually landed on main (deploy.yml no longer follows this
      # workflow by itself). A GITHUB_TOKEN may start workflow_dispatch runs.
      - name: Deploy the new photos
        if: steps.commit.outputs.committed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
