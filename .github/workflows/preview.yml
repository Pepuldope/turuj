name: Preview

# A test copy of a branch for Peter, before anything goes live (his rule, 2026-10-26:
# at most 5 live deploys a day, each batch tried first). Uploads a new Worker version
# with a preview address and does NOT send any visitors to it: turuj.sk stays as it is.
# The address is https://<alias>-turuj.<account>.workers.dev, printed in the run summary.
# Same build as deploy.yml; needs the same two secrets.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.CF_READY != 'true'
        run: echo "::notice::CLOUDFLARE_DEPLOY_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not set; no preview."
      - if: env.CF_READY == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - if: env.CF_READY == 'true'
        uses: actions/checkout@v7
      - if: env.CF_READY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: env.CF_READY == 'true'
        run: npm ci
      # Self-host the place photos so image search credits turuj.sk, not Wikimedia (C196). Commons URLs
      # stay as the fallback for any photo that fails to download; the cache saves re-downloading.
      - if: env.CF_READY == 'true'
        uses: actions/cache@v6
        with:
          path: public/photos/c
          key: commons-photos-${{ hashFiles('public/data/photos.json') }}
          restore-keys: commons-photos-
      # Link-preview pictures (C207): photo + logo + kind icon + name as a 1200x630 JPEG per place, made here
      # (not in git) and cached. A place without a photo gets its drawn terrain picture instead (data/terrain.json,
      # lib/terrainScene.ts, both in the key; data/share-terrain.json, written here, lists them for the build).
      # The cache sits before fetch-photos so its key is the photos.json as checked
      # out. Browser is installed only when something is missing. Never fails the deploy: a problem only
      # means that page shares the raw photo.
      - if: env.CF_READY == 'true'
        uses: actions/cache@v6
        with:
          path: public/og/p
          key: share-pics-v1-${{ hashFiles('public/data/photos.json', 'public/data/trips/**', 'data/terrain.json', 'lib/terrainScene.ts', 'scripts/share-pics.ts') }}
          restore-keys: share-pics-v1-
      - if: env.CF_READY == 'true'
        run: node scripts/fetch-photos.mjs
      - if: env.CF_READY == 'true'
        id: sharepics
        run: npx vite-node scripts/share-pics.ts --plan || echo "::warning::share-pics plan failed"
      - if: env.CF_READY == 'true' && steps.sharepics.outputs.missing != '0'
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - if: env.CF_READY == 'true'
        run: npx vite-node scripts/share-pics.ts || echo "::warning::share-pics failed; trip pages share the raw photo"
      - if: env.CF_READY == 'true'
        run: npx opennextjs-cloudflare build && node scripts/fast-pages.mjs
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      # Trip files are served from D1 (lib/tripJson.ts), not as static assets: Cloudflare's free plan allows
      # 20,000 files per deploy (C198). Dropped only when D1 holds them; if that can't be confirmed the
      # files stay (the budget check below then fails the deploy if there are too many). To undo: delete this step.
      - if: env.CF_READY == 'true'
        # Reads D1 with the Trip database workflow's token (D1 access); the deploy token may not have it.
        run: node scripts/prune-trip-assets.mjs || echo "::warning::Trip files NOT pruned from the assets (D1 not confirmed to hold them); see the log above."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: env.CF_READY == 'true'
        run: node scripts/asset-budget.mjs
      # Alias from the branch name: "claude/project-thread-7gs4ec" -> "project-thread-7gs4ec".
      - if: env.CF_READY == 'true'
        id: alias
        run: |
          a="${GITHUB_REF_NAME##*/}"
          a="$(echo "$a" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-' | cut -c1-40)"
          echo "alias=${a%-}" >> "$GITHUB_OUTPUT"
      - if: env.CF_READY == 'true'
        id: upload
        run: |
          set -o pipefail
          up() { npx opennextjs-cloudflare upload --preview-alias "${{ steps.alias.outputs.alias }}" 2>&1 | tee upload.log; }
          up || (sleep 60 && up)
          url="$(grep -oE 'https://${{ steps.alias.outputs.alias }}-turuj[a-z0-9.-]*workers\.dev' upload.log | head -1)"
          echo "Preview: ${url:-see the upload log above}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Preview ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Layout check (Peter, 2026-10-27): 0/1/10/100 saved trips, long and short names, phone to
      # computer sizes. Runs on the preview; a red step here means something overlaps or runs off
      # the screen. The report and screenshots are in the run's "layout-check" download.
      - if: env.CF_READY == 'true' && steps.upload.outputs.url != ''
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/layout-check.mjs "${{ steps.upload.outputs.url }}"
      - if: always() && env.CF_READY == 'true' && steps.upload.outputs.url != ''
        run: cat layout-check/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always() && env.CF_READY == 'true' && steps.upload.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: layout-check
          path: layout-check/
          if-no-files-found: ignore
